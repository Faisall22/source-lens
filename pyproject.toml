[project]
name = "sourcelens"
version = "0.1.0"
description = "JD in, grounded shortlist and outreach out. Eval-first LLM sourcing pipeline."
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.0",
    "pydantic>=2.6",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sourcelens"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
